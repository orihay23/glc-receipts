<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Donation Receipts</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #1a202c; }
    p.subtitle { color: #718096; font-size: 0.9rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; color: #4a5568; margin-bottom: 0.4rem; }
    input[type=password] {
      width: 100%; padding: 0.65rem 0.9rem;
      border: 1px solid #cbd5e0; border-radius: 8px;
      font-size: 1rem; margin-bottom: 1.25rem;
      outline: none; transition: border-color 0.2s;
    }
    input[type=password]:focus { border-color: #4f46e5; }
    button {
      width: 100%; padding: 0.75rem;
      background: #4f46e5; color: #fff;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    .error {
      background: #fff5f5; border: 1px solid #fc8181;
      color: #c53030; border-radius: 8px;
      padding: 0.65rem 0.9rem; font-size: 0.875rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Donation Receipts</h1>
    <p class="subtitle">Enter the dashboard password to continue.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
